name: Deploy to Firebase Hosting
on:
  push:
    branches:
      # Change this if your default branch is different
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Sets up the Flutter environment on the GitHub runner
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Caches dependencies to speed up future builds

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Customer Web App (lib/main.dart)
        run: flutter build web --release

      - name: Build POS Web App (lib/main_pos.dart)
        run: flutter build web --release --output build/web_pos --target lib/main_pos.dart --base-href=/pos/

      - name: Stage Hosting Directory
        run: |
          rm -rf public
          mkdir -p public/pos
          cp -r build/web/. public/
          cp -r build/web_pos/. public/pos/

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_RESTORENT_POS_SYSTEM }}'
          projectId: restorent-pos-system
          channelId: live
